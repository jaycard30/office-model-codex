<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dunder Mifflin Scranton — 3D Office Replica</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#121212;font-family:Arial,sans-serif}
    #overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.58);color:#fff;z-index:10;cursor:pointer}
    #panel{background:rgba(20,20,20,.86);padding:14px 16px;border:1px solid #666;max-width:520px;line-height:1.35}
    #hud{position:fixed;left:10px;top:10px;color:#fff;background:rgba(0,0,0,.45);padding:8px 10px;font-size:12px;z-index:5}
  </style>
</head>
<body>
<div id="overlay"><div id="panel"><h2>Explore Dunder Mifflin</h2><p>Click to lock mouse and walk the office.<br/>WASD move, mouse look, Shift sprint, Space jump, Esc unlock.</p></div></div>
<div id="hud">The Office replica (layout inspired by Jeff Beck blueprint set shared by OfficeTally). Warm practicals + fluorescent ambient blend.</div>
<script type="module" src="./src/main.js"></script>
